name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-artifact:
    name: Release artifact
    needs: [application-quality, security-and-dependencies, migration-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_sha256: ${{ steps.release.outputs.artifact_sha256 }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - name: Check out exact event head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build exact release artifact once
        id: release
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'loopedin-web-artifact'
          ./scripts/build-web-release.ps1 -OutputPath $artifact -SourceRevision $env:SOURCE_REVISION
          $manifest = Get-Content -Raw (Join-Path $artifact 'release-manifest.json') | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:SOURCE_REVISION) { throw 'Release artifact source commit does not match the event head.' }
          "artifact_sha256=$($manifest.artifactSha256)" >> $env:GITHUB_OUTPUT
          "source_commit=$($manifest.sourceCommit)" >> $env:GITHUB_OUTPUT
          "### Release artifact`n- Commit: ``$($manifest.sourceCommit)```n- SHA-256: ``$($manifest.artifactSha256)``" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload exact release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopedin-web-${{ steps.release.outputs.source_commit }}
          path: ${{ runner.temp }}/loopedin-web-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  application-quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - name: Lint app
        run: npm run lint
        working-directory: app
      - name: Test repository
        run: npm test
      - name: Test app
        run: npm test
        working-directory: app
      - name: Type-check app
        run: npx tsc --noEmit
        working-directory: app
      - name: Check build harness
        shell: pwsh
        run: ./scripts/check-harness.ps1

  security-and-dependencies:
    name: Security and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Scan repository for secrets
        run: npm run check:secrets
      - name: Audit dependency lockfile
        run: npm audit --package-lock-only --audit-level=high
        working-directory: app

  migration-integrity:
    name: Migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate migration order and checksums
        run: npm run check:migrations
      - name: Reject changed historical migrations on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs --base-ref "origin/${{ github.base_ref }}"
      - name: Reject changed historical migrations on main pushes
        if: github.event_name == 'push'
        run: node scripts/check-migrations.mjs --base-ref "${{ github.event.before }}"
      - name: Install Supabase CLI 2.109.0
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch
        with:
          version: 2.109.0
      - name: Apply and lint migrations in disposable local database
        shell: bash
        run: |
          set -euo pipefail
          trap 'supabase stop --no-backup' EXIT
          python - <<'PY'
          import os
          from pathlib import Path

          config_path = Path('supabase/config.toml')
          config = config_path.read_text(encoding='utf-8')
          replacements = {
              'project_id = "family-loop"': f'project_id = "family-loop-ci-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}"',
              'shadow_port = 54320': 'shadow_port = 65420',
              'port = 54321': 'port = 65421',
              'port = 54322': 'port = 65422',
              'port = 54323': 'port = 65423',
              'port = 54324': 'port = 65424',
              'port = 54327': 'port = 65427',
              'port = 54329': 'port = 65429',
          }
          for current, ci_value in replacements.items():
              if config.count(current) != 1:
                  raise SystemExit(f'Expected exactly one Supabase setting: {current}')
              config = config.replace(current, ci_value)
          config_path.write_text(config, encoding='utf-8')
          PY
          supabase start
          supabase db reset --local
          supabase db lint --local --level error
