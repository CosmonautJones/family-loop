name: Privacy-safe telemetry operations

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: Prove the alert path after safe maintenance
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: privacy-safe-telemetry-operations
  cancel-in-progress: true

jobs:
  staging:
    name: Staging retention and aggregate alert check
    environment: loopedin-staging-operations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Purge expired telemetry and check aggregate thresholds
        env:
          LOOPEDIN_TELEMETRY_STAGING_ACK: I_ACKNOWLEDGE_LOOPEDIN_STAGING_TELEMETRY
          LOOPEDIN_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.LOOPEDIN_STAGING_SUPABASE_SECRET_KEY }}
          LOOPEDIN_FORCE_TELEMETRY_ALERT: ${{ inputs.force_alert }}
        run: node scripts/maintain-hosted-error-telemetry.mjs
