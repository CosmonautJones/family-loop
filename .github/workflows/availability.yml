name: Hosted availability

on:
  # Manual-only during prelaunch development.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-availability
  cancel-in-progress: true

jobs:
  staging:
    name: Staging HTTPS and backend health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check privacy-safe public availability
        run: node scripts/check-hosted-availability.mjs
